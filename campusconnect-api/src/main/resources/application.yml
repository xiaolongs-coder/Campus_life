server:
  port: 8080
  servlet:
    context-path: /api

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  application:
    name: campusconnect-api
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: /

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/campusconnect?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.campusconnect.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:campusconnect-secret-key-2024-graduation-thesis-project}
  expiration: 86400000
  refresh-expiration: 604800000

upload:
  path: D:/AICompany_project/Campus_wall/social_school/campusconnect-api/uploads
  url-prefix: /uploads

logging:
  level:
    com.campusconnect: debug
    org.springframework.security: debug

# ==================== AI 配置 ====================
ai:
  llm:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen-plus
  embedding:
    enabled: true
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings
    api-key: ${DASHSCOPE_API_KEY}
    model: text-embedding-v4

qdrant:
  url: http://localhost:6333
  collection-name: campus_knowledge

ocr:
  paddle:
    python-path: ${PYTHON_PATH:python}
    lang: ch
    timeout: 60

---
# ==================== 生产环境 profile ====================
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    com.campusconnect: info
    org.springframework.security: warn

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
